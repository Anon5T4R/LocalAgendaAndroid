name: CI

# Dispara no push pra main e manualmente. Tags (v*) NÃO rodam o CI — o
# release.yml já cuida do build de release na tag.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Testes primeiro: a serialização das Settings (blob JSON do meta do .db,
      # compatível com o desktop) e o JsonLists são o contrato com o arquivo —
      # se quebra, não interessa se o APK sai.
      - name: Testes unitários
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Smoke real: abre o app num emulador e confirma que a UI sobe — o build
  # sozinho não pega crash de startup (o que matou a v0.1.0 do LocalKeys).
  # Emulador de CI é flaky crônico, por isso `continue-on-error: true`: o job
  # `build` acima é o portão de qualidade de verdade.
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Habilitar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test (emulador Android)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --console=plain
